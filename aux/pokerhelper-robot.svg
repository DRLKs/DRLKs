<svg xmlns="http://www.w3.org/2000/svg" viewBox="88 30 624 390" role="img" aria-labelledby="t">
  <title id="t">Minimalist poker robot holding a hand of cards</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#ce422b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ce422b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1513"/>
      <stop offset="1" stop-color="#110d0c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0a0807"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- faint table line -->
  <path d="M0 430 H800" stroke="#2a1a15" stroke-width="2"/>

  <!-- antenna -->
  <path d="M400 88 V58" stroke="#8a3a24" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="50" r="9" fill="#ce422b"/>

  <!-- head -->
  <rect x="300" y="88" width="200" height="150" rx="34" fill="url(#metal)" stroke="#ce422b" stroke-width="4"/>
  <!-- ears -->
  <rect x="282" y="138" width="18" height="50" rx="6" fill="#8a3a24"/>
  <rect x="500" y="138" width="18" height="50" rx="6" fill="#8a3a24"/>
  <!-- visor -->
  <rect x="326" y="126" width="148" height="56" rx="28" fill="#060404" stroke="#3a211a" stroke-width="2"/>
  <!-- eyes -->
  <rect x="352" y="146" width="30" height="16" rx="8" fill="#f0703a"/>
  <rect x="418" y="146" width="30" height="16" rx="8" fill="#f0703a"/>
  <!-- mouth: poker-face line -->
  <path d="M372 210 H428" stroke="#8a3a24" stroke-width="5" stroke-linecap="round"/>

  <!-- neck + body -->
  <rect x="380" y="238" width="40" height="18" fill="#2a1a15"/>
  <path d="M318 256 H482 a26 26 0 0 1 26 26 V430 H292 V282 a26 26 0 0 1 26 -26 Z" fill="url(#metal)" stroke="#ce422b" stroke-width="4"/>
  <!-- chest light -->
  <circle cx="400" cy="300" r="7" fill="#ce422b"/>
  <path d="M352 330 H448" stroke="#2a1a15" stroke-width="3"/>
  <path d="M352 346 H420" stroke="#2a1a15" stroke-width="3"/>

  <!-- hand of cards -->
  <g transform="translate(400 372)">
    <g transform="translate(-50 4) rotate(-20) translate(-34 -100)">
      <rect width="68" height="96" rx="8" fill="#14100e" stroke="#8a3a24" stroke-width="3"/>
      <text x="10" y="26" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#dea584">A</text>
      <path d="M34 46 C30 54 16 62 16 72 a9 9 0 0 0 16 5 l-4 11 h12 l-4 -11 a9 9 0 0 0 16 -5 C52 62 38 54 34 46 Z" fill="#dea584"/>
    </g>
    <g transform="translate(0 -6) translate(-34 -104)">
      <rect width="68" height="96" rx="8" fill="#14100e" stroke="#ce422b" stroke-width="3"/>
      <text x="10" y="26" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ce422b">K</text>
      <path d="M34 82 C14 66 14 54 22 50 a8 8 0 0 1 12 4 a8 8 0 0 1 12 -4 C54 54 54 66 34 82 Z" fill="#ce422b"/>
    </g>
    <g transform="translate(50 4) rotate(20) translate(-34 -100)">
      <rect width="68" height="96" rx="8" fill="#14100e" stroke="#8a3a24" stroke-width="3"/>
      <text x="10" y="26" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0703a">Q</text>
      <path d="M34 48 L50 66 L34 84 L18 66 Z" fill="#f0703a"/>
    </g>
  </g>
  <!-- hands -->
  <rect x="334" y="360" width="30" height="22" rx="10" fill="#8a3a24"/>
  <rect x="436" y="360" width="30" height="22" rx="10" fill="#8a3a24"/>

  <!-- probability readout -->
  <text x="560" y="150" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8a3a24">equity</text>
  <text x="560" y="182" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="#ce422b">72.4%</text>
  <path d="M560 200 H700" stroke="#2a1a15" stroke-width="6" stroke-linecap="round"/>
  <path d="M560 200 H661" stroke="#ce422b" stroke-width="6" stroke-linecap="round"/>
  <text x="120" y="150" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#8a3a24">action</text>
  <text x="120" y="182" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="#dea584">RAISE</text>
</svg>
